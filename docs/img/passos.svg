<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Como funciona: abra o app, rode a Otimização recomendada e reinicie">
<style>.c{opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.c{animation:none;opacity:1}}</style>
<rect width="1280" height="210" rx="20" fill="#0c0e12"/>
<g class="c" style="animation-delay:0.00s"><rect x="20.0" y="20" width="397" height="170" rx="16" fill="#14171d" stroke="#2e3440"/>
<circle cx="64.0" cy="64" r="24" fill="#0e2240"/><g transform="translate(64.0 64)"><rect x="-14" y="-11" width="28" height="20" rx="3" fill="none" stroke="#00d6ff" stroke-width="2.4"/><path d="M-6 14h12" stroke="#00d6ff" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="391" y="76" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#1f2530" text-anchor="end">1</text>
<text x="44.0" y="122" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f2f6">Abra o app</text>
<text x="44.0" y="150" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">Ele lê processador, placa de vídeo,</text><text x="44.0" y="171" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">memória e disco do seu PC.</text></g>
<path d="M423 105l8 0m-4 -5l5 5-5 5" fill="none" stroke="#2e68ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="c" style="animation-delay:0.15s"><rect x="441.3333333333333" y="20" width="397" height="170" rx="16" fill="#14171d" stroke="#2e3440"/>
<circle cx="485.3333333333333" cy="64" r="24" fill="#0e2240"/><g transform="translate(485.3333333333333 64)"><path d="M-3 -14L-11 3h9l-2 12 12-18h-9l3-11z" fill="#00d6ff"/></g>
<text x="813" y="76" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#1f2530" text-anchor="end">2</text>
<text x="465.3333333333333" y="122" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f2f6">Otimização recomendada</text>
<text x="465.3333333333333" y="150" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">Mostra o que vai mudar e pergunta antes.</text><text x="465.3333333333333" y="171" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">O que já está certo não é refeito.</text></g>
<path d="M845 105l8 0m-4 -5l5 5-5 5" fill="none" stroke="#2e68ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="c" style="animation-delay:0.30s"><rect x="862.6666666666666" y="20" width="397" height="170" rx="16" fill="#14171d" stroke="#2e3440"/>
<circle cx="906.6666666666666" cy="64" r="24" fill="#0e2240"/><g transform="translate(906.6666666666666 64)"><path d="M-12 1a12 12 0 1 0 4-9" fill="none" stroke="#00d6ff" stroke-width="2.4" stroke-linecap="round"/><path d="M-9 -14l1 7 7-1" fill="none" stroke="#00d6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1234" y="76" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#1f2530" text-anchor="end">3</text>
<text x="886.6666666666666" y="122" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f2f6">Reinicie e jogue</text>
<text x="886.6666666666666" y="150" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">Backup de tudo: desfaça um ajuste</text><text x="886.6666666666666" y="171" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9ca3b0">ou tudo, quando quiser.</text></g>
