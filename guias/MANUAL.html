<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual AVANTIPACK Pro</title>
<script>window.EDICAO='gratis';/*AVANTI_PC*/</script>
<style>
/* ===================== Página (cores do app AVANTIPACK Pro) ===================== */
:root{--bg:#0c0e12;--side:#0f1116;--card:#14171d;--card2:#1b1f27;--line:#2e3440;--line2:#232832;--txt:#f0f2f6;--mut:#9ca3b0;--ac:#00d6ff;--azul:#2e68ff;--ok:#3ddc97;--am:#ffb547;--red:#ff6b6b;--pin:#facc15;--chip:#1d222b;--sel:rgba(0,214,255,.10)}
html.claro{--bg:#f4f6f9;--side:#eaedf2;--card:#ffffff;--card2:#f3f5f8;--line:#c8d0db;--line2:#e3e8ef;--txt:#101319;--mut:#474f5d;--ac:#0070a0;--azul:#255ceb;--ok:#0c703e;--am:#965400;--red:#b42318;--chip:#e8edf3;--sel:rgba(0,112,160,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15.5px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
b{font-weight:650}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* barra lateral */
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 14px 30px}
.marca{display:flex;align-items:center;gap:10px;padding:0 8px 4px}
.marca .blocos{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.marca .blocos i{width:7px;height:7px;background:var(--ac);border-radius:1px}.marca .blocos i:nth-child(2n){opacity:.55}.marca .blocos i:nth-child(5){background:var(--azul);opacity:1}
.marca b{font-size:16px;letter-spacing:.14em;font-weight:800}
.marca span{color:var(--mut);font-size:12.5px;display:block;letter-spacing:0;font-weight:400}
.busca{margin:16px 4px 6px;position:relative}
.busca input{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:14px;outline:none}
.busca input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--sel)}
.busca:before{content:"⌕";position:absolute;left:12px;top:6px;color:var(--mut);font-size:17px}
#res{margin:0 4px 8px}
#res a{display:block;padding:7px 10px;border-radius:6px;color:var(--txt);font-weight:500;font-size:13.5px}
#res a small{display:block;color:var(--mut);font-size:12px}
#res a:hover{background:var(--card2);text-decoration:none}
#res .vazio{color:var(--mut);font-size:13px;padding:6px 10px}
nav .grupo{margin:18px 8px 4px;color:var(--mut);font-size:12.5px;font-weight:600}
nav a.cap{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--txt);font-weight:500;font-size:14.5px;position:relative}
nav a.cap:hover{background:var(--card2);text-decoration:none}
nav a.cap.on{background:var(--sel);font-weight:650}
nav a.cap.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ac)}
nav a.cap i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
nav a.cap .seu{margin-left:auto;font-size:11px;font-weight:700;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:5px;padding:0 6px}
.tema{margin:22px 8px 0;display:flex;gap:6px}
.tema button{flex:1;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.tema button.on{color:var(--txt);border-color:var(--ac)}

/* conteúdo */
main{padding:34px 40px 80px;max-width:1180px;width:100%}
.cab h1{margin:0;font-size:30px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
.cab p.res{margin:8px 0 0;color:var(--mut);max-width:70ch;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 0;color:var(--mut);font-size:13.5px}
.meta span b{color:var(--txt)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 26px}
.toc a{color:var(--txt);font-weight:500;font-size:13.5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.toc a:hover{border-color:var(--ac);text-decoration:none}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:18px 0 0;font-size:14.5px}
.aviso .ic{font-size:18px;line-height:1.3}

/* passo */
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 22px;scroll-margin-top:20px}
.step.alvo{box-shadow:0 0 0 2px var(--ac)}
.step-h{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 38px;height:38px;border-radius:10px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.step h3{margin:3px 0 0;font-size:19px;line-height:1.3;font-weight:700}
.step .sub{color:var(--mut);margin:4px 0 0;max-width:80ch}
.tags{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:3px;margin-left:6px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.auto{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.man{background:color-mix(in srgb,var(--am) 16%,transparent);color:var(--am)}
.tag.r-seguro{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.tag.r-moderado,.tag.r-importante{background:color-mix(in srgb,var(--am) 14%,transparent);color:var(--am)}
.tag.r-avancado{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.r-deixe{background:var(--chip);color:var(--mut)}
.tag.so{background:var(--chip);color:var(--txt)}
.onde{margin:18px 0 16px}
.onde ol{margin:0;padding:0;list-style:none}
.onde li{display:flex;gap:10px;align-items:flex-start;margin:7px 0;max-width:85ch}
.p{display:inline-grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--pin);color:#111;font-weight:800;font-size:12px;margin-top:1px}
.p.bul{background:var(--chip);color:var(--mut)}
.shot{margin:6px 0 4px;overflow-x:auto;padding:4px 2px 10px}
.alerta{margin-top:14px;padding:11px 14px;border-radius:9px;background:color-mix(in srgb,var(--red) 9%,transparent);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);font-size:14.5px}
.tip{margin-top:12px;padding:11px 14px;border-radius:9px;background:color-mix(in srgb,var(--am) 8%,transparent);border:1px solid color-mix(in srgb,var(--am) 30%,transparent);font-size:14.5px}
details.expl{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
details.expl summary{cursor:pointer;font-weight:650;font-size:14.5px;color:var(--txt);list-style:none;display:flex;align-items:center;gap:8px}
details.expl summary::-webkit-details-marker{display:none}
details.expl summary:before{content:"›";display:inline-block;transition:transform .15s;color:var(--ac);font-size:18px;line-height:1}
details.expl[open] summary:before{transform:rotate(90deg)}
details.expl summary span{color:var(--mut);font-weight:400}
.item{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:700}
.item .vl{display:inline-block;margin-left:8px;padding:0 8px;border-radius:5px;background:var(--sel);color:var(--ac);font-size:13px;font-weight:650}
.item .tx{color:var(--mut);font-size:14.5px;margin-top:2px;max-width:85ch}

/* cartões informativos */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;min-width:min(100%,520px)}
.cartao{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cartao h5{margin:0 0 6px;font-size:15px}
.cartao .tag{float:right;margin-left:8px}
.cartao ul{margin:0;padding-left:18px;color:var(--mut);font-size:14px}
.cartao li{margin:3px 0}

/* Comece aqui */
.pc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:22px 0 6px}
.pc div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pc small{display:block;color:var(--mut);font-size:12.5px}
.pc b{font-size:15px}
.roteiro{list-style:none;margin:26px 0 0;padding:0;counter-reset:r}
.roteiro li{counter-increment:r;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.roteiro li:before{content:counter(r);display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--azul);color:#fff;font-weight:800}
.roteiro li.feito{opacity:.6}.roteiro li.feito:before{content:"✓";background:var(--ok);color:#06150e}
.roteiro h4{margin:0;font-size:16px}
.roteiro p{margin:2px 0 0;color:var(--mut);font-size:14px}
.roteiro label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px;cursor:pointer;white-space:nowrap}
.legenda{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px;color:var(--mut);font-size:13.5px}
.legenda .pinx{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pin);color:#111;font-weight:800;font-size:11px;vertical-align:-4px;margin-right:4px}

/* Jogos */
.gjogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin:22px 0 26px}
.gjogos button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--c)}
.gjogos button:hover{border-color:var(--ac);border-left-color:var(--c)}
.gjogos button.on{background:var(--sel);border-color:var(--ac);border-left-color:var(--c)}
.gjogos button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.gjogos b{font-size:14.5px}
.gjogos small{color:var(--ok);font-size:12px;font-weight:600}
.notas{margin:14px 0 0;padding-left:20px;color:var(--mut);max-width:85ch}
.notas li{margin:5px 0}

/* Ajustes / evitamos */
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.cat summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.cat summary::-webkit-details-marker{display:none}
.cat summary span{color:var(--mut);font-weight:400;font-size:14px}
.cat .lin{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:10px 18px;border-top:1px solid var(--line2)}
.cat .lin b{font-weight:650}
.cat .lin p{margin:0;color:var(--mut);font-size:14px;grid-column:1}
.cat .lin .tag{grid-row:1/span 2;grid-column:2;align-self:start}
.tag.op{background:var(--chip);color:var(--mut)}
.tag.ri{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.mitos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:22px}
.mitos div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mitos h5{margin:0 0 4px;font-size:15px;display:flex;gap:8px}
.mitos h5:before{content:"✕";color:var(--red);font-weight:800}
.mitos p{margin:0;color:var(--mut);font-size:14px}
.rodape{color:var(--mut);font-size:13px;border-top:1px solid var(--line);padding-top:16px;margin-top:34px;max-width:85ch}

/* celular / janela estreita */
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:22px 16px 60px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ===================== Ilustrações das telas ===================== */
:root{--mut2:#93a0b8}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pin);color:#111!important;font:800 11px/1 "Segoe UI",sans-serif;box-shadow:0 0 0 3px rgba(250,204,21,.35);margin:0 4px;vertical-align:middle;flex:0 0 20px}
.adr .top .t.glow,.adr .subt span.glow,.nvapp .stabs span.glow{padding:0 8px;gap:4px}
.glow{outline:2px solid var(--pin)!important;outline-offset:-2px;box-shadow:0 0 0 4px rgba(250,204,21,.25)!important}

/* ===================== Menu do botão direito (Windows 11) ===================== */
.ctx{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;font:13px "Segoe UI",sans-serif}
.ctx .m{background:#2b2b2b;border:1px solid #3d3d3d;border-radius:8px;padding:5px;min-width:260px;color:#eee;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ctx .m div{padding:6px 10px;border-radius:4px;display:flex;align-items:center;gap:10px}
.ctx .m div .ic{width:16px;text-align:center;opacity:.8}
.ctx .m hr{border:0;border-top:1px solid #444;margin:4px 6px}
.ctx .m.old{background:#f2f2f2;color:#111;border-color:#ccc;border-radius:0;padding:2px}
.ctx .m.old div{border-radius:0;padding:4px 22px}
.ctx .m.old hr{border-top-color:#ccc}
.ctx .arrow{align-self:center;font-size:26px;color:var(--mut)}

/* ===================== Painel de Controle NVIDIA (estilo) ===================== */
.nvcp{min-width:820px;background:#f0f0f0;color:#000;border:1px solid #7a7a7a;font:12px "Segoe UI",Tahoma,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nvcp .tb{display:flex;align-items:center;padding:6px 8px;background:#fff;border-bottom:1px solid #d9d9d9}
.nvcp .tb .t{flex:1;padding-left:4px}
.nvcp .tb .wb{display:flex;gap:16px;color:#333;padding-right:6px}
.nvcp .mn{display:flex;gap:2px;padding:2px 4px;background:#f5f5f5;border-bottom:1px solid #d9d9d9}
.nvcp .mn span{padding:2px 8px}
.nvcp .tl{display:flex;gap:10px;align-items:center;padding:4px 8px;border-bottom:1px solid #c9c9c9;background:linear-gradient(#fbfbfb,#ececec);color:#333}
.nvcp .tl .b{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid transparent}
.nvcp .bd{display:grid;grid-template-columns:250px 1fr;min-height:330px}
.nvcp .tree{background:#fff;border-right:1px solid #b9b9b9;padding:6px 0}
.nvcp .tree .h{padding:2px 8px 6px;color:#555}
.nvcp .tree .g{padding:2px 6px;font-weight:600;display:flex;align-items:center;gap:4px}
.nvcp .tree .g:before{content:"⊟";font-weight:400;color:#555}
.nvcp .tree .i{padding:2px 6px 2px 26px;display:flex;align-items:center;color:#0b3fa8}
.nvcp .tree .i.on{background:#cce4f7;border:1px dotted #333;color:#000}
.nvcp .pane{background:#fff;display:flex;flex-direction:column}
.nvcp .ban{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid #76b900;background:linear-gradient(90deg,#fafafa,#eef3e6)}
.nvcp .ban .tt{font-size:17px;font-weight:600;color:#222}
.nvcp .ban .bk{margin-left:auto;font-size:11px;color:#0b3fa8}
.nvcp .ds{padding:8px 14px;color:#333}
.nvcp .sec{padding:6px 14px 2px;font-weight:600;color:#1a1a1a}
.nvcp .tabsx{display:flex;padding:0 14px;margin-top:6px}
.nvcp .tabsx span{padding:4px 12px;border:1px solid #b9b9b9;border-bottom:0;background:#e9e9e9;margin-right:2px;display:inline-flex;align-items:center}
.nvcp .tabsx span.on{background:#fff;position:relative;top:1px}
.nvcp .box{margin:0 14px;border:1px solid #b9b9b9;padding:8px}
.nvcp .grid{width:100%;border-collapse:collapse;border:1px solid #a9a9a9}
.nvcp .grid th{background:linear-gradient(#fff,#e8e8e8);border:1px solid #c9c9c9;text-align:left;font-weight:400;padding:3px 6px}
.nvcp .grid td{border-bottom:1px solid #eee;padding:3px 6px;white-space:nowrap}
.nvcp .grid tr.sel td{background:#3399ff;color:#fff}
.nvcp .grid tr.sel td .dd{background:#fff;color:#000}
.nvcp .dd{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;min-width:200px;border:1px solid #7a7a7a;background:#fff;padding:1px 4px}
.nvcp .dd:after{content:"▼";font-size:8px;color:#333}
.nvcp .row{display:flex;align-items:center;gap:8px;padding:4px 0}
.nvcp .lbl{min-width:220px}
.nvcp .chk{display:inline-block;width:13px;height:13px;border:1px solid #333;background:#fff;text-align:center;line-height:11px;font-size:11px}
.nvcp .rad{display:inline-block;width:12px;height:12px;border:1px solid #333;border-radius:50%;background:#fff;position:relative}
.nvcp .rad.on:after{content:"";position:absolute;inset:2px;border-radius:50%;background:#1a1a1a}
.nvcp .list{border:1px solid #a9a9a9;background:#fff;width:260px;height:88px;overflow:hidden}
.nvcp .list div{padding:1px 4px}.nvcp .list div.on{background:#3399ff;color:#fff}
.nvcp .ft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;margin-top:auto;border-top:1px solid #e3e3e3}
.nvcp .btn{min-width:72px;text-align:center;padding:3px 10px;border:1px solid #adadad;background:linear-gradient(#f6f6f6,#dedede);border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.nvcp .st{display:flex;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid #c9c9c9;background:#f0f0f0;color:#0b3fa8}

/* ===================== NVIDIA App (estilo) ===================== */
.nvapp{min-width:820px;background:#1a1a1a;color:#e8e8e8;border:1px solid #333;border-radius:8px;overflow:hidden;font:13px "Segoe UI",sans-serif;display:grid;grid-template-columns:64px 1fr;min-height:300px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nvapp .rail{background:#111;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px}
.nvapp .rail div{width:52px;padding:7px 0;border-radius:6px;text-align:center;font-size:10px;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:2px}
.nvapp .rail div b{font-size:17px;font-weight:400}
.nvapp .rail div.on{background:#262626;color:#76b900}
.nvapp .mainx{padding:16px 20px}
.nvapp h5{margin:0 0 4px;font-size:20px;font-weight:600}
.nvapp .stabs{display:flex;gap:18px;border-bottom:1px solid #333;margin:10px 0 12px}
.nvapp .stabs span{padding:6px 0;color:#aaa;display:inline-flex;align-items:center}
.nvapp .stabs span.on{color:#fff;border-bottom:2px solid #76b900}
.nvapp .r{display:flex;align-items:center;justify-content:space-between;background:#232323;border-radius:6px;padding:10px 12px;margin-bottom:6px}
.nvapp .r small{display:block;color:#999}
.sw{display:inline-block;width:40px;height:20px;border-radius:20px;background:#555;position:relative;vertical-align:middle;flex:0 0 40px}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#ddd}
.sw.on:after{left:23px;background:#fff}
.nvapp .sw.on{background:#76b900}

/* ===================== AMD Adrenalin (estilo) ===================== */
.adr{min-width:860px;background:#141416;color:#eaeaea;border:1px solid #2c2c30;border-radius:8px;overflow:hidden;font:13px "Segoe UI",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.adr .top{display:flex;align-items:center;gap:22px;padding:0 16px;height:46px;background:#0d0d0f;border-bottom:1px solid #26262a}
.adr .top .brand{font-weight:700;letter-spacing:.04em;color:#fff}
.adr .top .t{color:#b7b7bd;display:inline-flex;align-items:center;height:46px}
.adr .top .t.on{color:#fff;border-bottom:3px solid #e8343b}
.adr .top .ic{margin-left:auto;display:flex;gap:16px;color:#b7b7bd;align-items:center}
.adr .subt{display:flex;gap:20px;padding:0 16px;height:38px;align-items:center;border-bottom:1px solid #26262a;background:#17171a}
.adr .subt span{color:#a5a5ab;display:inline-flex;align-items:center;height:38px}
.adr .subt span.on{color:#fff;border-bottom:2px solid #e8343b}
.adr .cont{padding:14px 16px 16px}
.adr .profs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.adr .profs div{background:#1f1f23;border:1px solid #2e2e33;border-radius:6px;padding:10px;text-align:center;color:#c9c9cf;display:flex;align-items:center;justify-content:center;gap:4px}

<body>
<div class="app">
 <aside>
  <div class="marca"><div class="blocos"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><b>AVANTIPACK</b><span>Manual ilustrado do Pro</span></div></div>
  <div class="busca"><input id="q" type="search" placeholder="Procurar no manual" aria-label="Procurar no manual"></div>
  <div id="res"></div>
  <nav id="nav" aria-label="Capítulos"></nav>
  <div class="tema" role="group" aria-label="Tema"><button data-t="escuro">Escuro</button><button data-t="claro">Claro</button></div>
 </aside>
 <main id="main"></main>
</div>
<script>
/* ---------- utilidades de desenho ---------- */
const P = n => n ? `<span class="pin">${n}</span>` : '';
const sw = (on) => `<span class="sw ${on?'on':''}"></span>`;
const G = (n) => n ? ' glow' : '';

/* ---------- Menu do botão direito ---------- */
function telaCtx(o){
  return `<div class="ctx">
   <div class="m">
     <div><span class="ic">▦</span>Exibir</div><div><span class="ic">⇅</span>Classificar por</div><div><span class="ic">↻</span>Atualizar</div>
     <hr><div><span class="ic">＋</span>Novo</div><hr>
     <div><span class="ic">🖥</span>Configurações de exibição</div><div><span class="ic">🖌</span>Personalizar</div><hr>
     <div><span class="ic">⌨</span>Abrir no Terminal</div><hr>
     <div class="glow"><span class="ic">⋯</span>Mostrar mais opções ${P(1)}</div>
   </div>
   <div class="arrow">→</div>
   <div class="m old">
     <div>Exibir</div><div>Classificar por</div><div>Atualizar</div><hr>
     <div class="glow">${o.item} ${P(2)}</div><hr>
     <div>Novo</div><hr><div>Configurações de exibição</div><div>Personalizar</div>
   </div></div>`;
}

/* ---------- Painel de Controle NVIDIA ---------- */
const NV_TREE = [
  ['Configurações 3D', ['Ajustar as configurações de imagem com visualização','Gerenciar as configurações 3D','Configurar Surround, PhysX']],
  ['Exibição', ['Alterar resolução','Ajustar as configurações de cor da área de trabalho','Girar a exibição','Ver o status do HDCP','Configurar o áudio digital','Ajustar o tamanho e a posição da área de trabalho','Configurar G-SYNC','Configurar várias telas']],
  ['Vídeo', ['Ajustar as configurações de cor do vídeo','Ajustar as configurações de imagem do vídeo']],
];
function telaNvcp(o){
  const tree = NV_TREE.map(([g,its]) => `<div class="g">${g}</div>` + its.map(i =>
     `<div class="i ${i===o.ativo?'on':''}${i===o.ativo&&o.pinNav?' glow':''}">${i}${i===o.ativo?P(o.pinNav):''}</div>`).join('')).join('');
  return `<div class="nvcp">
    <div class="tb"><span class="t">Painel de controle NVIDIA</span><span class="wb">─ ☐ ✕</span></div>
    <div class="mn"><span>Arquivo</span><span>Editar</span><span>Desktop</span><span>Configurações 3D</span><span>Ajuda</span></div>
    <div class="tl"><span class="b">◀ Voltar</span><span class="b">▶</span><span class="b">⌂</span></div>
    <div class="bd"><div class="tree"><div class="h">Selecione uma tarefa...</div>${tree}</div>
      <div class="pane"><div class="ban"><span class="tt">${o.ativo}</span><span class="bk">Restaurar padrões</span></div>
        <div class="ds">${o.desc||''}</div>${o.corpo}
        ${o.botoes?`<div class="ft">${o.botoes.map(([b,p])=>`<span class="btn${G(p)}">${b}${P(p)}</span>`).join('')}</div>`:''}
      </div></div>
    <div class="st">ⓘ Informações do sistema</div></div>`;
}
function nvGrid(linhas, pinTab, pinSel){
  return `<div class="tabsx"><span class="on${G(pinTab)}">Configurações globais ${P(pinTab)}</span><span>Configurações do programa</span></div>
    <div class="box"><div style="margin-bottom:6px">Configurações:</div><table class="grid"><tr><th>Recurso</th><th>Configuração</th></tr>${
     linhas.map(([n,v,p]) => `<tr class="${p===pinSel?'sel':''}"><td>${P(p)}${n}</td><td>${p===pinSel?`<span class="dd">${v}</span>`:v}</td></tr>`).join('')}</table></div>`;
}

/* ---------- NVIDIA App ---------- */
function telaNvapp(o){

   onde:['Em <b>Exibição</b>, clique em <b>Configurar G-SYNC</b>. Se este item não aparece, o seu monitor ou o seu cabo não tem suporte; pule este passo.',
         'Marque <b>Ativar G-SYNC, G-SYNC Compatible</b>.',
         'Escolha <b>Ativar para modo de janela e tela cheia</b>.',
         'Clique em <b>Aplicar</b>.'],
   tela: telaNvcp({ ativo:'Configurar G-SYNC', pinNav:1, desc:'O G-SYNC elimina o tearing e minimiza a oscilação da tela e o atraso de entrada.',
     corpo:`<div style="padding:6px 14px">
       <div class="row glow" style="padding:4px 6px">${P(2)}<span class="chk">✓</span>Ativar G-SYNC, G-SYNC Compatible</div>
       <div class="row" style="padding-left:28px"><span class="rad"></span>Ativar para o modo de tela cheia</div>
       <div class="row glow" style="padding:4px 6px 4px 28px">${P(3)}<span class="rad on"></span>Ativar para o modo de janela e tela cheia</div>
       <div class="sec" style="padding-left:0;margin-top:8px">2. Selecione a tela para a qual você deseja alterar a configuração.</div>
       <div class="row"><span class="chk">✓</span>Ativar configurações para o modelo de tela selecionado</div></div>`,
     botoes:[['Aplicar',4]] }),
   itens:[
     [2,'Ativar G-SYNC','marcado','Liga a sincronização variável. O monitor passa a esperar o quadro ficar pronto, em vez de mostrar meio quadro.'],
     [3,'Modo de janela e tela cheia','marcado','Faz funcionar também em jogos em "tela cheia sem borda", que é como a maioria roda hoje.'],
   ],
   dica:'Com G-SYNC, o jeito certo é: G-SYNC ligado + V-Sync "Ativado" no painel (passo 2) + V-Sync desligado dentro do jogo + FPS limitado 3 abaixo do Hz. O Otimizar meu PC (opção 1) aplica tudo isso se você responder Sim quando ela perguntar sobre G-SYNC. Detalhes no capítulo <a href="#fps">Limite de FPS</a>.' },

 { id:'nv-physx', tit:'PhysX na placa de vídeo', modo:'man',
   sub:'Alguns jogos usam PhysX para física e efeitos. Ele precisa rodar na placa, não no processador.',
   onde:['Em <b>Configurações 3D</b>, clique em <b>Configurar Surround, PhysX</b>.',
         'Em <b>Processador PhysX</b>, escolha o nome da sua placa (GeForce RTX/GTX...).',
         'Clique em <b>Aplicar</b>.'],
   tela: telaNvcp({ ativo:'Configurar Surround, PhysX', pinNav:1, desc:'',
     corpo:`<div style="padding:6px 14px"><div class="sec" style="padding-left:0">Configurações do PhysX</div>
       <div class="row glow" style="padding:4px 6px">${P(2)}<span class="lbl">Processador PhysX:</span><span class="dd">GeForce RTX (sua placa)</span></div>
       <div style="margin-top:10px;border:1px solid #ccc;height:80px;display:grid;place-items:center;color:#777">[ desenho: placa → monitores ]</div></div>`,
     botoes:[['Aplicar',3]] }),
   itens:[[2,'Processador PhysX','sua placa de vídeo','Em "Seleção automática" ou "CPU", a física pode ir para o processador, que é bem mais lento nisso. Resultado: quedas de FPS em explosões e destruição.']] },

 { id:'nv-escala', tit:'Resolução esticada (só para quem joga em 4:3)', modo:'man',
   sub:'Para CS2, Valorant e outros jogados em resolução esticada (ex.: 1280x960). Quem joga na resolução normal pode pular.',
   onde:['Em <b>Exibição</b>, clique em <b>Ajustar o tamanho e a posição da área de trabalho</b>.',
         'Em <b>Selecione um modo de escala</b>, escolha <b>Tela cheia</b>.',
         'Em <b>Executar escala em</b>, escolha <b>GPU</b>.',
         'Clique em <b>Aplicar</b>.'],
   tela: telaNvcp({ ativo:'Ajustar o tamanho e a posição da área de trabalho', pinNav:1, desc:'',
     corpo:`<div class="tabsx"><span class="on">Escala</span><span>Tamanho</span></div><div class="box">
       <div class="row" style="font-weight:600">Selecione um modo de escala:</div>
       <div class="row" style="padding-left:12px"><span class="rad"></span>Proporção</div>
       <div class="row glow" style="padding:4px 6px 4px 12px">${P(2)}<span class="rad on"></span>Tela cheia</div>
       <div class="row" style="padding-left:12px"><span class="rad"></span>Sem escala</div>
       <div class="row glow" style="padding:4px 6px;margin-top:6px">${P(3)}<span class="lbl">Executar escala em:</span><span class="dd" style="min-width:120px">GPU</span></div></div>`,
     botoes:[['Aplicar',4]] }),
   itens:[[2,'Modo de escala','Tela cheia','Estica a imagem 4:3 para ocupar a tela inteira, sem barras pretas.'],[3,'Executar escala em','GPU','A placa de vídeo faz o "esticamento", em vez do monitor. Fica igual em qualquer monitor e com menos atraso.']] },
]},

/* ------------------------------ AMD ------------------------------ */
{ id:'amd', nome:'AMD – Adrenalin', cor:'#e8343b', passos:[
 { id:'amd-abrir', tit:'Abrir o AMD Software (Adrenalin)', modo:'man',
   sub:'É o programa da AMD onde ficam todas as configurações da placa Radeon.',
   onde:['Clique com o <b>botão direito</b> em um espaço vazio da área de trabalho e escolha <b>Mostrar mais opções</b> (no Windows 10 este passo não existe).',

 { id:'amd-graf', tit:'Gráficos globais (a parte mais importante)', modo:'auto',
   sub:'Valem para todos os jogos. O AVANTIPACK já liga o Anti-Lag e desliga o Chill. O resto você confere aqui; a AMD não deixa programa nenhum mudar tudo sozinho.',
   onde:['Clique em <b>Jogos</b>, no menu de cima.',
         'Clique na sub-aba <b>Gráficos</b>.',
         'Em perfil gráfico, escolha <b>Personalizado</b> (NÃO o HYPR-RX).',
         'Desça a lista e deixe cada opção como na tela (veja a explicação de cada uma embaixo).',
         'No fim da página, clique em <b>Avançado</b> para abrir mais opções (próximo passo).'],
   tela: telaAdr({ top:'Jogos', pinTop:1, sub:[['Jogos'],['Gráficos',2,true],['Tela'],['Vídeo']],
     perfis:[['HYPR-RX'],['HYPR-RX Eco'],['Padrão'],['Personalizado',true,3]],
     linhas:[
       ['Radeon Anti-Lag','Reduz o atraso entre o clique e a tela',true,4],
       ['Radeon Chill','Economiza energia baixando o FPS quando você fica parado',false,5],
       ['Radeon Boost','Baixa a resolução quando você mexe a câmera',false,6],
       ['Radeon Super Resolution','Upscaling do driver para qualquer jogo',false,7],
       ['Radeon Image Sharpening','Deixa a imagem mais nítida',false],
       ['Radeon Enhanced Sync','Alternativa ao V-Sync',false,8],
       ['Aguardar atualização vertical','V-Sync do driver','Sempre desativado',9],
     ], avancado:10 }),
   itens:[
     [3,'Perfil Personalizado','selecionado','O HYPR-RX liga o Radeon Boost e outros recursos de uma vez. Em jogo competitivo ele mais atrapalha do que ajuda. No Personalizado você controla cada opção.'],
     [4,'Radeon Anti-Lag','Ativado','Diminui o input lag: o clique do mouse aparece mais rápido na tela. Em jogos compatíveis ele vira Anti-Lag 2, que é ainda melhor.'],
     [5,'Radeon Chill','Desativado','Baixa o FPS quando você não está se mexendo, para economizar energia. Ruim para jogar e não funciona junto com o Anti-Lag.'],
     [6,'Radeon Boost','Desativado','Reduz a resolução enquanto você mexe a câmera. A imagem fica borrada justo na hora da mira.'],
     [7,'Radeon Super Resolution','Desativado','Upscaling genérico que deixa até o menu do jogo embaçado. Prefira o FSR dentro do próprio jogo.'],
     [8,'Enhanced Sync','Desativado','É conhecido por causar travadinhas e telas pretas em alguns jogos.'],
     [9,'Aguardar atualização vertical','Sempre desativado','É o V-Sync. Desligado = menos input lag. Exceção: com FreeSync, veja o capítulo <a href="#fps">Limite de FPS</a>.'],
   ] },

 { id:'amd-adv', tit:'Gráficos – Avançado', modo:'man',

         'Em <b>Qualidade da filtragem de textura</b>, escolha <b>Desempenho</b>.',
         'Ligue a <b>Otimização do formato de superfície</b>.',
         'Deixe <b>Modo de tesselação</b> e <b>Cache do sombreador</b> em <b>Otimizado pela AMD</b>.'],
   tela: telaAdr({ top:'Jogos', sub:[['Jogos'],['Gráficos',0,true],['Tela'],['Vídeo']],
     linhas:[
       ['Avançado ⌃','',' ',1],
       ['Qualidade da filtragem de textura','Qualidade das texturas vistas em ângulo','Desempenho',2],
       ['Otimização do formato de superfície','Usa formatos de imagem mais leves',true,3],
       ['Modo de tesselação','Detalhe extra em superfícies','Otimizado pela AMD',4],

          [3,'Formato de superfície','Ativado','O driver troca alguns formatos de imagem por versões mais leves. Ganha FPS sem perder qualidade visível.'],
          [4,'Tesselação e Cache','Otimizado pela AMD','Esse padrão já é o melhor. Só confira se ninguém mudou. O cache evita travadinhas na primeira vez que um efeito aparece.']] },

 { id:'amd-tela', tit:'Tela: FreeSync', modo:'man',
   sub:'FreeSync faz o monitor acompanhar o FPS: sem cortes na imagem e sem o atraso do V-Sync.',

 { id:'amd-rec', tit:'Gravação em segundo plano e sobreposição', modo:'man',

 { id:'amd-sam', tit:'Conferir o Smart Access Memory', modo:'man',
   sub:'É o nome que a AMD dá ao Resizable BAR. Dá FPS a mais em vários jogos.',

]},

 { id:'win-gpu-app', tit:'Notebook com 2 placas: jogo na placa dedicada', modo:'man',

 { id:'win-energia', tit:'Modo de energia (notebook)', modo:'auto',

/* ---------- menu lateral ---------- */
function montarMenu(){
  let html = '', grupo = null;
  for (const c of CAPS){
    if (c.g !== grupo){ grupo = c.g; if (grupo) html += `<div class="grupo">${grupo}</div>`; }
    const seu = PC && c.seu && c.seu() && c.g !== 'Windows' && c.g !== 'Placa-mãe' && c.g !== 'Dentro dos jogos';
    html += `<a class="cap" href="#${c.id}" data-id="${c.id}"><i style="background:${c.cor||'var(--mut)'}"></i>${c.nome}${seu?'<span class="seu">seu PC</span>':''}</a>`;
  }
  document.getElementById('nav').innerHTML = html;
}

/* ---------- um passo ---------- */
const RISCO = { seguro:'Seguro', moderado:'Risco moderado', avancado:'Avançado', deixe:'Deixe como está', importante:'Importante' };
function passo(p, i){
  const n = it => it ? `<span class="p">${it}</span>` : '<span class="p bul">•</span>';
  return `<section class="step" id="${p.id}">
   <div class="step-h"><div class="num">${i+1}</div><div>
     <h3>${p.tit}<span class="tags">${p.modo==='info'?'':`<span class="tag ${p.modo==='auto'?'auto':'man'}">${p.modo==='auto'?'O '+QUEM+' já faz':'Você faz'}</span>`}${p.risco?`<span class="tag r-${p.risco}">${RISCO[p.risco]}</span>`:''}${p.so?`<span class="tag so">Só ${p.so==='amd'?'AMD':'Intel'}</span>`:''}</span></h3>
     ${p.sub?`<p class="sub">${p.sub}</p>`:''}</div></div>
   ${p.onde&&p.onde.length?`<div class="onde"><ol>${p.onde.map((t,k)=>`<li><span class="p">${k+1}</span><span>${t}</span></li>`).join('')}</ol></div>`:''}
   ${p.tela?`<div class="shot">${p.tela}</div>`:''}
   ${p.fab?`<table class="fab"><tr><th>Placa</th><th>Onde fica e como se chama</th></tr>${p.fab.map(([m,t])=>`<tr><td>${m}</td><td>${t}</td></tr>`).join('')}</table>`:''}
   ${p.alerta?`<div class="alerta">⚠ ${p.alerta}</div>`:''}
   ${p.itens?`<details class="expl"><summary>O que cada opção faz <span>(${p.itens.length})</span></summary>${p.itens.map(([k,nome,val,tx])=>`
      <div class="item">${n(k)}<div><span class="nm">${nome}</span>${val&&val!=='—'?`<span class="vl">${val}</span>`:''}<div class="tx">${tx}</div></div></div>`).join('')}</details>`:''}
   ${p.dica?`<div class="tip">💡 ${p.dica}</div>`:''}
  </section>`;
}
function cabecalho(c, extra){
  return `<div class="cab"><h1>${c.tit}</h1>${c.res?`<p class="res">${c.res}</p>`:''}${extra||''}</div>`;
}
function capituloGuia(c){
  const g = GUIAS.find(x=>x.id===c.id);
  const auto = g.passos.filter(p=>p.modo==='auto').length;
  const meta = `<div class="meta"><span><b>${g.passos.length}</b> passos</span>${c.tempo?`<span>cerca de <b>${c.tempo}</b></span>`:''}${auto?`<span><b>${auto}</b> o ${QUEM} já faz, é só conferir</span>`:''}</div>`;
  const naoSeu = PC && c.seu && !c.seu() ? `<div class="aviso"><span class="ic">ℹ</span><div>Este capítulo não é para as peças do seu PC (${c.g==='Processador'?PC.cpuNome:PC.gpuNome}). Pode pular.</div></div>` : '';
  return cabecalho(c, meta + naoSeu) +
    `<div class="toc">${g.passos.map((p,i)=>`<a href="#${c.id}/${p.id}">${i+1}. ${p.tit}</a>`).join('')}</div>` +
    g.passos.map(passo).join('');
}

/* ---------- Comece aqui ---------- */
function gpuCap(){ return temGpu('AMD') ? 'amd' : temGpu('INTEL') ? 'intel' : 'nvidia'; }
function capInicio(c){
  const pc = PC ? `<div class="pc">
     <div><small>Processador</small><b>${PC.cpuNome||'—'}</b></div>

   : `<div class="aviso"><span class="ic">ℹ</span><div>Abrindo pelo ${GRATIS?'pack (<b>opção 5, Guias passo a passo</b>)':'app (<b>Restauração › Manual ilustrado</b>)'}, o manual mostra as peças do seu PC e marca os capítulos que servem para você.</div></div>`;
  const gc = capDe(gpuCap());
  const cpu = temCpu('INTEL') ? 'intelcpu' : 'ryzen';
  const passos = [
    ['ot',GRATIS?'Rode o Otimizar meu PC (opção 1)':'Rode o Otimizar meu PC (opção 1) no app','Ela faz sozinha quase tudo do Windows e boa parte do painel da placa.','windows','Conferir o Windows'],
    ['gpu',`Painel da placa de vídeo (${PC?gc.nome:'NVIDIA, AMD ou Intel'})`,'Baixa latência, cache de shader, Hz do monitor.',gc.id,'Abrir'],
    ['bios','BIOS: perfil de memória e Resizable BAR','Os dois ajustes que mais dão FPS fora do Windows.','bios','Abrir'],
    ['cpu',`Processador${PC?' ('+capDe(cpu).nome+')':''}`,'Driver de chipset e o que muda no seu modelo.',cpu,'Abrir'],
    ['jogos','Dentro dos jogos','Valores competitivos do seu jogo.','jogos','Abrir'],
    ['fps','Limite de FPS','Termine travando o FPS do jeito certo.','fps','Abrir']];
  let feitos = {}; try { feitos = JSON.parse(localStorage.getItem('avanti-roteiro')||'{}'); } catch(e){}
  return cabecalho(c) + pc +
   `<ol class="roteiro">${passos.map(([k,t,d,id,bt])=>`<li class="${feitos[k]?'feito':''}" data-k="${k}"><div><h4><a href="#${id}">${t}</a></h4><p>${d}</p></div>
      <label><input type="checkbox" ${feitos[k]?'checked':''}> feito</label></li>`).join('')}</ol>
   <div class="legenda"><span><span class="tag auto">O ${QUEM} já faz</span> abra só para conferir</span><span><span class="tag man">Você faz</span> leva poucos segundos</span><span><span class="pinx">1</span> onde clicar, na ordem</span></div>
   <p class="rodape">As telas deste manual são ilustrações: a sua pode ter outra cor ou outra ordem, mas as opções têm os mesmos nomes. Algo ficou pior depois de mudar? Volte a opção para o valor de antes, ou use <b>${GRATIS?'Desfazer (opção 6)':'Desfazer (opção 6)'}</b> para o que o AVANTIPACK mudou.</p>`;
}

/* ---------- Jogos ---------- */
let jogoAtual = null;
function capJogos(c, sub){
  const j = JOGOS.find(x=>x.id===sub) || null; jogoAtual = j;
  const regras = cards(REGRAS_JOGOS.map(([t,l])=>[t,l]));
  const grade = `<div class="gjogos">${JOGOS.map(x=>`<button data-j="${x.id}" class="${j&&j.id===x.id?'on':''}" style="--c:${x.cor}"><b>${x.nome}</b>${x.auto?(GRATIS?'<small style="color:var(--am)">automático no Pro</small>':'<small>o app configura</small>'):''}</button>`).join('')}</div>`;
  let det = '';
  if (j){
    det = `<section class="step" id="jogo"><div class="step-h"><div class="num" style="background:${j.cor};color:#111">▶</div><div>
       <h3>${j.nome}</h3><p class="sub">Onde: <b>${j.onde}</b>. Os nomes estão como no jogo em inglês; em português é a mesma opção, no mesmo lugar.</p></div></div>
       ${j.auto&&GRATIS?`<div class="tip">⚡ No AVANTIPACK Pro este jogo é configurado sozinho, com cópia para desfazer. Aqui no grátis, siga a tela abaixo.</div>`:''}${j.auto&&!GRATIS?`<div class="tip">⚡ O AVANTIPACK grava isto sozinho: <b>Jogos › Configurações gráficas</b>, com o jogo fechado. Resolução, sensibilidade e texturas ficam do seu jeito.</div>`:''}
       <div class="shot" style="margin-top:14px">${telaJogo(j)}</div>
       <p style="color:var(--mut);font-size:13.5px;margin:4px 0 0">As linhas destacadas são as que mais importam. O resto é para ganhar FPS.</p>
       ${j.notas?`<ul class="notas">${j.notas.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}</section>`;
  }
  return cabecalho(c, `<div class="meta"><span><b>${JOGOS.length}</b> jogos</span>${GRATIS?'':`<span><b>${JOGOS.filter(x=>x.auto).length}</b> o app configura sozinho</span>`}</div>`) +
    `<div style="margin-top:22px">${regras}</div>` + grade + (det || `<p class="rodape" style="border:0;margin-top:0">Escolha um jogo acima.</p>`) +
    `<p class="rodape">Conferido em novembro de 2026 em guias oficiais e de esports. Os jogos mudam com as atualizações: se uma opção sumir ou mudar de nome, siga as regras do topo.</p>`;
}

/* ---------- navegação ---------- */
function ir(hash){
  const [id, sub] = (hash||'').replace(/^#/,'').split('/');
  const c = capDe(id) || capDe('inicio');
  let html;
  if (c.id==='inicio') html = capInicio(c);
  else if (c.id==='jogos') html = capJogos(c, sub);
  else if (c.id==='ajustes') html = capAjustes(c);
  else if (c.id==='evitamos') html = capEvitamos(c);
  else html = capituloGuia(c);
  const m = document.getElementById('main');
  m.innerHTML = html;
  document.querySelectorAll('#nav a.cap').forEach(a=>a.classList.toggle('on', a.dataset.id===c.id));
  document.title = c.tit + ' · Manual AVANTIPACK' + (GRATIS?'':' Pro');
  const alvo = c.id==='jogos' ? (sub ? document.getElementById('jogo') : null) : (sub ? document.getElementById(sub) : null);
  if (alvo){ alvo.classList.add('alvo'); alvo.scrollIntoView({block:'start'}); setTimeout(()=>alvo.classList.remove('alvo'), 1600); }
  else window.scrollTo(0,0);
}
window.addEventListener('hashchange', ()=>ir(location.hash));
document.addEventListener('click', e=>{
  const b = e.target.closest('.gjogos button'); if (b){ location.hash = 'jogos/' + b.dataset.j; return; }
  const t = e.target.closest('.tema button'); if (t){ aplicarTema(t.dataset.t, true); }
});
document.addEventListener('change', e=>{
  const li = e.target.closest('.roteiro li'); if (!li) return;
  let f = {}; try { f = JSON.parse(localStorage.getItem('avanti-roteiro')||'{}'); } catch(x){}
  f[li.dataset.k] = e.target.checked; li.classList.toggle('feito', e.target.checked);
  try { localStorage.setItem('avanti-roteiro', JSON.stringify(f)); } catch(x){}
});

/* ---------- busca ---------- */
const INDICE = [];
GUIAS.forEach(g=>g.passos.forEach(p=>INDICE.push({t:p.tit, onde:(capDe(g.id)||{}).nome||g.nome, h:`#${g.id}/${p.id}`, txt:(p.tit+' '+(p.sub||'')+' '+(p.onde||[]).join(' ')+' '+(p.itens||[]).map(i=>i[1]+' '+i[3]).join(' ')+' '+(p.fab||[]).map(f=>f[1]).join(' ')).replace(/<[^>]+>/g,' ')})));
JOGOS.forEach(j=>INDICE.push({t:j.nome, onde:'Configurações por jogo', h:`#jogos/${j.id}`, txt:j.nome+' '+j.grupos.map(g=>g[1].map(r=>r[0]).join(' ')).join(' ')}));
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
document.getElementById('q').addEventListener('input', e=>{
  const q = semAcento(e.target.value.trim()); const r = document.getElementById('res');
  if (q.length < 2){ r.innerHTML=''; return; }
  const ach = INDICE.filter(x=>semAcento(x.txt).includes(q)).sort((a,b)=>(semAcento(b.t).includes(q))-(semAcento(a.t).includes(q))).slice(0,8);
  r.innerHTML = ach.length ? ach.map(x=>`<a href="${x.h}">${x.t}<small>${x.onde}</small></a>`).join('') : '<div class="vazio">Nada encontrado.</div>';
});

/* ---------- tema (segue o app) ---------- */
function aplicarTema(t, salvar){
  document.documentElement.classList.toggle('claro', t==='claro');
  document.querySelectorAll('.tema button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  if (salvar) try { localStorage.setItem('avanti-tema', t); } catch(e){}
}
let tema = window.TEMA || 'escuro'; try { tema = localStorage.getItem('avanti-tema') || tema; } catch(e){}
aplicarTema(tema, false);
document.querySelector('.marca span').textContent = GRATIS ? 'Manual ilustrado' : 'Manual ilustrado do Pro';
montarMenu();
ir(location.hash || (window.INICIO ? '#'+window.INICIO : '#inicio'));

</script>
</body>
</html>
